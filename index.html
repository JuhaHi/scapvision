<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ScrapVision + Roboflow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    html, body { height: 100dvh; background: #121212; color: #fff; display: flex; flex-direction: column; overflow: hidden; }

    header { flex-shrink: 0; padding: 8px 12px; background: #1e1e1e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 10; }
    h1 { font-size: 0.9rem; color: #00e676; }
    .header-btns { display: flex; gap: 6px; }
    .btn-header { background: #333; color: #fff; border: 1px solid #555; padding: 5px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }

    .viewport { position: relative; flex: 1; min-height: 0; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }
    #ai-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

    /* Modal / Asetukset */
    #settings-modal {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 50; padding: 20px; flex-direction: column; justify-content: center;
    }
    .modal-content { background: #1e1e1e; padding: 16px; border-radius: 10px; border: 1px solid #444; }
    .modal-content h2 { font-size: 1rem; margin-bottom: 12px; color: #00e676; }
    .input-group { margin-bottom: 12px; text-align: left; }
    .input-group label { display: block; font-size: 0.75rem; color: #aaa; margin-bottom: 4px; }
    .input-group input { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #555; color: #fff; border-radius: 6px; font-size: 0.9rem; }

    /* Painikkeet */
    .controls {
      flex-shrink: 0; background: #1a1a1a;
      padding: 8px 8px calc(65px + env(safe-area-inset-bottom, 0px)) 8px;
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; border-top: 1px solid #333; z-index: 10;
    }
    .btn-category { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-weight: bold; font-size: 0.85rem; min-height: 44px; }
    .btn-category:active { background: #3d3d3d; transform: scale(0.98); }
    .badge { font-size: 1.1rem; color: #00e676; font-weight: 800; }

    .btn-copper  { border-left: 5px solid #d87040; }
    .btn-wires   { border-left: 5px solid #00bcd4; }
    .btn-plastic { border-left: 5px solid #ffeb3b; }
    .btn-alu     { border-left: 5px solid #e0e0e0; }
    .btn-other   { border-left: 5px solid #9e9e9e; }

    .btn-ai-toggle { grid-column: span 2; background: #6200ea; border: none; padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; color: #fff; }
    .btn-ai-toggle.active { background: #00e676; color: #000; }

    #toast { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); border: 1px solid #00e676; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 30; text-align: center; max-width: 90%; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <h1>ScrapVision MVP</h1>
    <div class="header-btns">
      <button class="btn-header" onclick="toggleSettings()">⚙️ Asetukset</button>
      <button class="btn-header" style="color: #cf6679;" onclick="resetCounters()">Nollaa</button>
    </div>
  </header>

  <div class="viewport">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="ai-canvas"></canvas>
    <div id="toast"></div>

    <div id="settings-modal">
      <div class="modal-content">
        <h2>Roboflow Asetukset</h2>
        <div class="input-group">
          <label>Private API Key:</label>
          <input type="text" id="rf-key" placeholder="esim. UyNaQE5Wlsfv88kfGGpW">
        </div>
        <div class="input-group">
          <label>Projektin ID (Project ID / Slug):</label>
          <input type="text" id="rf-project" placeholder="esim. scrap-1h3vq">
        </div>
        <div class="input-group">
          <label>Mallin versio (vain tunnistukseen):</label>
          <input type="number" id="rf-version" value="1">
        </div>
        <button class="btn-header" style="width: 100%; padding: 12px; background: #00e676; color: #000; font-size: 0.9rem;" onclick="saveSettings()">Tallenna asetukset</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-category btn-copper" data-category="Kupari"><span>Kupari</span><span class="badge" id="c-Kupari">0</span></button>
    <button class="btn-category btn-wires" data-category="Johdot"><span>Johdot</span><span class="badge" id="c-Johdot">0</span></button>
    <button class="btn-category btn-plastic" data-category="Muovi"><span>Muovi</span><span class="badge" id="c-Muovi">0</span></button>
    <button class="btn-category btn-alu" data-category="Alumiini"><span>Alumiini</span><span class="badge" id="c-Alumiini">0</span></button>
    <button class="btn-category btn-other" data-category="Muu" style="grid-column: span 2;"><span>Muu</span><span class="badge" id="c-Muu">0</span></button>
    <button class="btn-ai-toggle" id="ai-toggle-btn" onclick="toggleAutoInference()">⚡ Käynnistä Roboflow AI-tunnistus (Live)</button>
  </div>

  <canvas id="snapshot-canvas" style="display: none;"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const aiCanvas = document.getElementById('ai-canvas');
    const snapCanvas = document.getElementById('snapshot-canvas');
    const toast = document.getElementById('toast');

    let isAiRunning = false;
    let aiInterval = null;
    const counts = { Kupari: 0, Johdot: 0, Muovi: 0, Alumiini: 0, Muu: 0 };

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }
        });
        video.srcObject = stream;
      } catch (err) {
        console.error("Kamera ei aukea:", err);
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
      }
    }

    function toggleSettings() {
      const modal = document.getElementById('settings-modal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
      document.getElementById('rf-key').value = localStorage.getItem('rf_key') || '';
      document.getElementById('rf-project').value = localStorage.getItem('rf_project') || '';
      document.getElementById('rf-version').value = localStorage.getItem('rf_version') || '1';
    }

    function saveSettings() {
      localStorage.setItem('rf_key', document.getElementById('rf-key').value.trim());
      localStorage.setItem('rf_project', document.getElementById('rf-project').value.trim());
      localStorage.setItem('rf_version', document.getElementById('rf-version').value.trim());
      toggleSettings();
      showToast("Asetukset tallennettu!");
    }

    // Suora Base64-lähetys Roboflow Upload APIin
    async function uploadToRoboflow(category) {
      if (!video.videoWidth) return;

      const apiKey = localStorage.getItem('rf_key');
      const project = localStorage.getItem('rf_project');

      if (!apiKey || !project) {
        alert("Aseta ensin Roboflow-tiedot rattaasta (⚙️)!");
        toggleSettings();
        return;
      }

      // Kasvatetaan laskuria
      counts[category]++;
      if (document.getElementById(`c-${category}`)) {
        document.getElementById(`c-${category}`).innerText = counts[category];
      }

      // Kaapataan kuva
      snapCanvas.width = video.videoWidth;
      snapCanvas.height = video.videoHeight;
      const ctx = snapCanvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      // Muunnetaan puhtaaksi Base64-merkkijonoksi (ilman 'data:image/jpeg;base64,' etuliitettä)
      const fullBase64 = snapCanvas.toDataURL('image/jpeg', 0.85);
      const cleanBase64 = fullBase64.split(',')[1];

      showToast(`Lähetetään Roboflowhun (${category})...`);

      const filename = `${category}_${Date.now()}.jpg`;
      const url = `https://api.roboflow.com/dataset/${project}/upload?api_key=${apiKey}&name=${encodeURIComponent(filename)}&split=train&tag=${encodeURIComponent(category)}`;

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: cleanBase64
        });

        const data = await res.json();

        if (res.ok && (data.success || data.id || data.duplicate)) {
          showToast(`✅ ${category} tallennettu Roboflowhun!`);
        } else {
          console.error("Roboflow vastaus:", data);
          alert(`Virhe: ${JSON.stringify(data)}`);
        }
      } catch (err) {
        console.error("Verkkovirhe:", err);
        alert(`Yhteysvirhe: ${err.message}`);
      }
    }

    // Reaaliaikainen inferenssi (Live AI)
    async function runInference() {
      const apiKey = localStorage.getItem('rf_key');
      const project = localStorage.getItem('rf_project');
      const version = localStorage.getItem('rf_version') || '1';

      if (!apiKey || !project || !video.videoWidth) return;

      snapCanvas.width = 640;
      snapCanvas.height = (video.videoHeight / video.videoWidth) * 640;
      const ctx = snapCanvas.getContext('2d');
      ctx.drawImage(video, 0, 0, snapCanvas.width, snapCanvas.height);
      const base64 = snapCanvas.toDataURL('image/jpeg', 0.7).split(',')[1];

      const url = `https://detect.roboflow.com/${project}/${version}?api_key=${apiKey}&confidence=40`;

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: base64
        });
        const data = await res.json();
        if (data.predictions) {
          drawPredictions(data.predictions);
        }
      } catch (err) {
        console.error(err);
      }
    }

    function drawPredictions(predictions) {
      aiCanvas.width = video.clientWidth;
      aiCanvas.height = video.clientHeight;
      const ctx = aiCanvas.getContext('2d');
      ctx.clearRect(0, 0, aiCanvas.width, aiCanvas.height);

      const scaleX = aiCanvas.width / snapCanvas.width;
      const scaleY = aiCanvas.height / snapCanvas.height;

      predictions.forEach(p => {
        const x = (p.x - p.width / 2) * scaleX;
        const y = (p.y - p.height / 2) * scaleY;
        const w = p.width * scaleX;
        const h = p.height * scaleY;

        ctx.strokeStyle = "#00e676";
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, w, h);

        ctx.fillStyle = "#00e676";
        ctx.font = "bold 14px sans-serif";
        ctx.fillText(`${p.class} (${Math.round(p.confidence * 100)}%)`, x, y > 15 ? y - 5 : 15);
      });
    }

    function toggleAutoInference() {
      const apiKey = localStorage.getItem('rf_key');
      const project = localStorage.getItem('rf_project');
      if (!apiKey || !project) {
        alert("Aseta ensin Roboflow-tiedot rattaasta (⚙️)!");
        toggleSettings();
        return;
      }

      isAiRunning = !isAiRunning;
      const btn = document.getElementById('ai-toggle-btn');
      if (isAiRunning) {
        btn.classList.add('active');
        btn.innerText = "⏹ Pysäytä AI-tunnistus";
        aiInterval = setInterval(runInference, 900);
      } else {
        btn.classList.remove('active');
        btn.innerText = "⚡ Käynnistä Roboflow AI-tunnistus (Live)";
        clearInterval(aiInterval);
        const ctx = aiCanvas.getContext('2d');
        ctx.clearRect(0, 0, aiCanvas.width, aiCanvas.height);
      }
    }

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function resetCounters() {
      if (confirm("Nollataanko laskurit?")) {
        for (let k in counts) { counts[k] = 0; if (document.getElementById(`c-${k}`)) document.getElementById(`c-${k}`).innerText = 0; }
      }
    }

    document.querySelectorAll('.btn-category').forEach(b => {
      b.addEventListener('click', () => uploadToRoboflow(b.dataset.category));
    });

    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>

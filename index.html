<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <title>BLE Raw Packet Logger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d1117;
      color: #00ff88;
      font-family: "SF Mono", "Roboto Mono", "Courier New", monospace;
      padding: 10px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 0.9rem;
      color: #00f0ff;
      text-transform: uppercase;
    }
    .stats {
      font-size: 0.75rem;
      color: #8b949e;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    button {
      flex: 1;
      padding: 12px 6px;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.75rem;
      text-transform: uppercase;
      cursor: pointer;
    }
    .btn-scan { background: #00f0ff; color: #0d1117; }
    .btn-stop { background: #ff3344; color: #fff; }
    .btn-copy { background: #238636; color: #fff; }
    .btn-clear { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; flex: 0.6; }
    
    #logBox {
      flex: 1;
      width: 100%;
      background: #010409;
      color: #00ff88;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 8px;
      font-family: inherit;
      font-size: 0.65rem;
      line-height: 1.4;
      white-space: pre;
      overflow-y: auto;
      resize: none;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <header>
    <h1>BLE Raw Sniffer</h1>
    <div id="pktCount" class="stats">Paketteja: 0 kpl</div>
  </header>

  <div class="btn-group">
    <button id="scanBtn" class="btn-scan">1. Aloita Skannaus</button>
    <button id="copyBtn" class="btn-copy">2. Kopioi Kaikki</button>
    <button id="clearBtn" class="btn-clear">Tyhjennä</button>
  </div>

  <textarea id="logBox" readonly placeholder="Paina 'Aloita Skannaus' nähdäksesi raakadatan..."></textarea>

  <script>
    let isScanning = false;
    let scanController = null;
    let totalCount = 0;

    const scanBtn = document.getElementById('scanBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const logBox = document.getElementById('logBox');
    const pktCount = document.getElementById('pktCount');

    async function toggleScan() {
      if (isScanning) {
        if (scanController) scanController.stop();
        navigator.bluetooth.removeEventListener('advertisementreceived', handleAd);
        isScanning = false;
        scanBtn.textContent = "Aloita Skannaus";
        scanBtn.className = "btn-scan";
      } else {
        try {
          scanController = await navigator.bluetooth.requestLEScan({
            acceptAllAdvertisements: true,
            keepRepeatedDevices: true
          });
          navigator.bluetooth.addEventListener('advertisementreceived', handleAd);
          isScanning = true;
          scanBtn.textContent = "Pysäytä Skannaus";
          scanBtn.className = "btn-stop";
          appendLog(`--- SKANNAUS ALOITETTU: ${new Date().toLocaleTimeString()} ---\n`);
        } catch (e) {
          alert("BLE Virhe: " + e.message);
        }
      }
    }

    function handleAd(event) {
      totalCount++;
      pktCount.textContent = `Paketteja: ${totalCount} kpl`;

      const now = new Date();
      const timeStr = `${now.toTimeString().split(' ')[0]}.${now.getMilliseconds().toString().padStart(3, '0')}`;
      const name = event.device.name || "Tuntematon";
      const rssi = event.rssi !== undefined ? `${event.rssi}dBm` : "N/A";
      const devId = event.device.id.substring(0, 10);

      let payloads = [];

      if (event.manufacturerData && event.manufacturerData.size > 0) {
        for (const [companyId, dataView] of event.manufacturerData.entries()) {
          const cidHex = "0x" + companyId.toString(16).padStart(4, '0').toUpperCase();
          const bytes = new Uint8Array(dataView.buffer, dataView.byteOffset, dataView.byteLength);
          const rawHex = Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join('');
          payloads.push(`[CID:${cidHex} LEN:${bytes.length} RAW:${rawHex}]`);
        }
      } else {
        payloads.push("[EI_MANUFACTURER_DATA]");
      }

      const logLine = `[${timeStr}] ${name} (${rssi}) ID:${devId} => ${payloads.join(' ')}\n`;
      appendLog(logLine);
    }

    function appendLog(text) {
      logBox.value += text;
      logBox.scrollTop = logBox.scrollHeight; // Automaattinen vieritys pohjalle
    }

    // Kopiointi leikepöydälle
    copyBtn.addEventListener('click', () => {
      if (!logBox.value) return;
      navigator.clipboard.writeText(logBox.value).then(() => {
        const orig = copyBtn.textContent;
        copyBtn.textContent = "✓ KOPIOITU!";
        copyBtn.style.background = "#00f0ff";
        copyBtn.style.color = "#000";
        setTimeout(() => {
          copyBtn.textContent = orig;
          copyBtn.style.background = "#238636";
          copyBtn.style.color = "#fff";
        }, 1500);
      }).catch(err => {
        // Varamenetelmä mobiilille
        logBox.select();
        document.execCommand('copy');
        alert("Teksti valittu/kopioitu!");
      });
    });

    // Tyhjennys
    clearBtn.addEventListener('click', () => {
      logBox.value = "";
      totalCount = 0;
      pktCount.textContent = "Paketteja: 0 kpl";
    });

    scanBtn.addEventListener('click', toggleScan);
  </script>
</body>
</html>

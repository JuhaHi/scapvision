<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ScrapVision + Roboflow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    html, body { height: 100dvh; background: #121212; color: #fff; display: flex; flex-direction: column; overflow: hidden; }

    header { flex-shrink: 0; padding: 8px 12px; background: #1e1e1e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 10; }
    h1 { font-size: 0.9rem; color: #00e676; }
    .header-btns { display: flex; gap: 6px; }
    .btn-header { background: #333; color: #fff; border: 1px solid #555; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }

    /* Videon ja AI-tunnistuslaatikoiden overlay-alue */
    .viewport { position: relative; flex: 1; min-height: 0; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }
    #ai-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

    /* Asetusikkuna (Modal) */
    #settings-modal {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 50; padding: 20px; flex-direction: column; justify-content: center;
    }
    .modal-content { background: #1e1e1e; padding: 16px; border-radius: 10px; border: 1px solid #444; }
    .modal-content h2 { font-size: 1rem; margin-bottom: 12px; color: #00e676; }
    .input-group { margin-bottom: 10px; text-align: left; }
    .input-group label { display: block; font-size: 0.75rem; color: #aaa; margin-bottom: 4px; }
    .input-group input { width: 100%; padding: 8px; background: #2a2a2a; border: 1px solid #555; color: #fff; border-radius: 6px; font-size: 0.85rem; }

    /* Ohjauspainikkeet alhaalla */
    .controls {
      flex-shrink: 0; background: #1a1a1a;
      padding: 8px 8px calc(65px + env(safe-area-inset-bottom, 0px)) 8px;
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; border-top: 1px solid #333; z-index: 10;
    }
    .btn-category { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-weight: bold; font-size: 0.85rem; min-height: 42px; }
    .btn-category:active { background: #3d3d3d; }
    .badge { font-size: 1.1rem; color: #00e676; font-weight: 800; }

    .btn-copper  { border-left: 5px solid #d87040; }
    .btn-wires   { border-left: 5px solid #00bcd4; }
    .btn-plastic { border-left: 5px solid #ffeb3b; }
    .btn-alu     { border-left: 5px solid #e0e0e0; }
    .btn-other   { border-left: 5px solid #9e9e9e; }

    /* AI Live Inference Nappi */
    .btn-ai-toggle {
      grid-column: span 2; background: #6200ea; border: none; padding: 10px;
      border-radius: 8px; font-size: 0.85rem; font-weight: bold; color: #fff;
    }
    .btn-ai-toggle.active { background: #00e676; color: #000; }

    #toast { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); border: 1px solid #555; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 30; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <h1>ScrapVision + Roboflow</h1>
    <div class="header-btns">
      <button class="btn-header" onclick="toggleSettings()">⚙️ Asetukset</button>
      <button class="btn-header" style="color: #cf6679;" onclick="resetCounters()">Nollaa</button>
    </div>
  </header>

  <div class="viewport">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="ai-canvas"></canvas>
    <div id="toast"></div>

    <!-- Asetusvalikko Roboflow API-avaimille -->
    <div id="settings-modal">
      <div class="modal-content">
        <h2>Roboflow Asetukset</h2>
        <div class="input-group">
          <label>Roboflow API Key (Private API Key):</label>
          <input type="password" id="rf-key" placeholder="esim. w98XyZ123...">
        </div>
        <div class="input-group">
          <label>Malli / Endpoint (Project/Version):</label>
          <input type="text" id="rf-model" placeholder="esim. scrap-sorting/1">
        </div>
        <button class="btn-header" style="width: 100%; padding: 10px; background: #00e676; color: #000; margin-top: 8px;" onclick="saveSettings()">Tallenna</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-category btn-copper" data-category="Kupari"><span>Kupari</span><span class="badge" id="c-Kupari">0</span></button>
    <button class="btn-category btn-wires" data-category="Johdot"><span>Johdot</span><span class="badge" id="c-Johdot">0</span></button>
    <button class="btn-category btn-plastic" data-category="Muovi"><span>Muovi</span><span class="badge" id="c-Muovi">0</span></button>
    <button class="btn-category btn-alu" data-category="Alumiini"><span>Alumiini</span><span class="badge" id="c-Alumiini">0</span></button>
    <button class="btn-category btn-other" data-category="Muu" style="grid-column: span 2;"><span>Muu / Sekalainen</span><span class="badge" id="c-Muu">0</span></button>
    
    <button class="btn-ai-toggle" id="ai-toggle-btn" onclick="toggleAutoInference()">
      ⚡ Käynnistä Roboflow AI-tunnistus (Live)
    </button>
  </div>

  <canvas id="snapshot-canvas" style="display: none;"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const aiCanvas = document.getElementById('ai-canvas');
    const snapCanvas = document.getElementById('snapshot-canvas');
    const toast = document.getElementById('toast');
    
    let isAiRunning = false;
    let aiInterval = null;
    const counts = { Kupari: 0, Johdot: 0, Muovi: 0, Alumiini: 0, Muu: 0 };

    // 1. Kameran käynnistys
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }
        });
        video.srcObject = stream;
      } catch (err) {
        console.error("Kamera ei aukea:", err);
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
      }
    }

    // 2. Asetusten hallinta (LocalStorage)
    function toggleSettings() {
      const modal = document.getElementById('settings-modal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
      document.getElementById('rf-key').value = localStorage.getItem('rf_key') || '';
      document.getElementById('rf-model').value = localStorage.getItem('rf_model') || '';
    }

    function saveSettings() {
      localStorage.setItem('rf_key', document.getElementById('rf-key').value.trim());
      localStorage.setItem('rf_model', document.getElementById('rf-model').value.trim());
      toggleSettings();
      showToast("Asetukset tallennettu!");
    }

    // 3. Kuvan lähettäminen suoraan Roboflow-koulutusdataan (Upload API)
    async function uploadToRoboflowDataset(base64Image, category) {
      const apiKey = localStorage.getItem('rf_key');
      const modelEndpoint = localStorage.getItem('rf_model'); // esim "scrap-sorting/1" -> projektin nimi on "scrap-sorting"
      const projectName = modelEndpoint ? modelEndpoint.split('/')[0] : null;

      if (!apiKey || !projectName) {
        // Jos API-avainta ei ole annettu, ladataan tiedosto vain puhelimen muistiin
        downloadImageLocally(base64Image, category);
        return;
      }

      showToast(`Lähetetään Roboflowhun: ${category}...`);

      const cleanBase64 = base64Image.split(',')[1];
      const url = `https://api.roboflow.com/dataset/${projectName}/upload?api_key=${apiKey}&name=${category}_${Date.now()}.jpg&split=train&tag=${category}`;

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: cleanBase64
        });
        if (res.ok) {
          showToast(`✅ ${category} viety Roboflowhun!`);
        } else {
          downloadImageLocally(base64Image, category);
        }
      } catch (e) {
        console.error(e);
        downloadImageLocally(base64Image, category);
      }
    }

    function downloadImageLocally(base64Image, category) {
      const link = document.createElement('a');
      link.download = `${category}_${Date.now()}.jpg`;
      link.href = base64Image;
      link.click();
      showToast(`Tallennettu laitteelle: ${category}`);
    }

    // 4. Manuaalinen kuvanotto / Taggaus
    function captureAndProcess(category) {
      if (!video.videoWidth) return;
      snapCanvas.width = video.videoWidth;
      snapCanvas.height = video.videoHeight;
      snapCanvas.getContext('2d').drawImage(video, 0, 0);
      const base64 = snapCanvas.toDataURL('image/jpeg', 0.85);

      counts[category]++;
      if (document.getElementById(`c-${category}`)) {
        document.getElementById(`c-${category}`).innerText = counts[category];
      }
      uploadToRoboflowDataset(base64, category);
    }

    // 5. Reaaliaikainen Roboflow AI-Inference (Havaitsija hihnalle)
    async function runInference() {
      const apiKey = localStorage.getItem('rf_key');
      const modelEndpoint = localStorage.getItem('rf_model');

      if (!apiKey || !modelEndpoint || !video.videoWidth) return;

      snapCanvas.width = 640; // Pienennetään kuvaa nopean verkkosiirron takaamiseksi
      snapCanvas.height = (video.videoHeight / video.videoWidth) * 640;
      const ctx = snapCanvas.getContext('2d');
      ctx.drawImage(video, 0, 0, snapCanvas.width, snapCanvas.height);
      const base64 = snapCanvas.toDataURL('image/jpeg', 0.7).split(',')[1];

      const url = `https://detect.roboflow.com/${modelEndpoint}?api_key=${apiKey}&confidence=40`;

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: base64
        });
        const data = await res.json();
        if (data.predictions) {
          drawPredictions(data.predictions);
        }
      } catch (err) {
        console.error("AI Inference virhe:", err);
      }
    }

    // Piirretään laatikot ja tekstit videon päälle
    function drawPredictions(predictions) {
      aiCanvas.width = video.clientWidth;
      aiCanvas.height = video.clientHeight;
      const ctx = aiCanvas.getContext('2d');
      ctx.clearRect(0, 0, aiCanvas.width, aiCanvas.height);

      const scaleX = aiCanvas.width / snapCanvas.width;
      const scaleY = aiCanvas.height / snapCanvas.height;

      predictions.forEach(p => {
        const x = (p.x - p.width / 2) * scaleX;
        const y = (p.y - p.height / 2) * scaleY;
        const w = p.width * scaleX;
        const h = p.height * scaleY;

        // Laatikko
        ctx.strokeStyle = "#00e676";
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, w, h);

        // Nimilappu
        ctx.fillStyle = "#00e676";
        ctx.font = "bold 14px sans-serif";
        ctx.fillText(`${p.class} (${Math.round(p.confidence * 100)}%)`, x, y > 15 ? y - 5 : 15);
      });
    }

    function toggleAutoInference() {
      const apiKey = localStorage.getItem('rf_key');
      const model = localStorage.getItem('rf_model');
      if (!apiKey || !model) {
        alert("Aseta ensin Roboflow API Key ja Mallin nimi ratas-painikkeesta (⚙️)!");
        toggleSettings();
        return;
      }

      isAiRunning = !isAiRunning;
      const btn = document.getElementById('ai-toggle-btn');

      if (isAiRunning) {
        btn.classList.add('active');
        btn.innerText = "⏹ Pysäytä AI-tunnistus";
        aiInterval = setInterval(runInference, 800); // Kysely Roboflowlta n. 1s välein
      } else {
        btn.classList.remove('active');
        btn.innerText = "⚡ Käynnistä Roboflow AI-tunnistus (Live)";
        clearInterval(aiInterval);
        const ctx = aiCanvas.getContext('2d');
        ctx.clearRect(0, 0, aiCanvas.width, aiCanvas.height);
      }
    }

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }

    function resetCounters() {
      if (confirm("Nollataanko laskurit?")) {
        for (let k in counts) { counts[k] = 0; if(document.getElementById(`c-${k}`)) document.getElementById(`c-${k}`).innerText = 0; }
      }
    }

    document.querySelectorAll('.btn-category').forEach(b => {
      b.addEventListener('click', () => captureAndProcess(b.dataset.category));
    });

    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
